[project]
name = "servidor-mcp"
version = "1.0.0"
description = "Servidor MCP central-de-salas (Streamable HTTP, MRTR na reserva)"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.12.5",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
