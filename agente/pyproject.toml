[project]
name = "agente"
version = "1.0.0"
description = "Agente Central de Salas: servidor A2A v1.0 por fora, host MCP por dentro"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "mcp==2.3.0",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
